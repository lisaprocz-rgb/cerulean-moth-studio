<style>
:root{--fs:20px;--ink:#1b1f24;--muted:#4a5562;--bg:#f6f7f9;--card:#fff;--line:#d5dbe3;--navy:#1f3864;--note:#fff6d6;--noteb:#e2c35b;--ref:#eef3fb;--refb:#9fb5d9;--faq:#f1f7ef;--faqb:#9cc590}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:var(--fs);line-height:1.5}
header{background:var(--navy);color:#fff;padding:16px 20px}
header h1{margin:0;font-size:1.3em}
.test{background:#b3261e;color:#fff;padding:10px 20px;font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar label{font-weight:700}
select,input,button{font:inherit}
select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;max-width:100%}
.sz button{padding:4px 12px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:16px 16px 80px}
.errs{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
.errs label{font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:14px 0}
#mark{position:fixed;right:6px;bottom:6px;width:9px;height:9px;border-radius:50%}
#mark.live{background:#2e7d32}
.stale{background:#fff4d6;border:2px solid #b7791f;padding:12px 16px;margin:12px;border-radius:8px;font-weight:600}
.card h2{margin:0 0 8px;font-size:.85em;letter-spacing:.04em;text-transform:uppercase;color:var(--navy)}
.say{font-size:1.1em;margin:8px 0;white-space:pre-line}
.vnote{background:var(--note);border-left:5px solid var(--noteb);padding:8px 12px;margin:8px 0;font-size:.95em;white-space:pre-line}
.ref{background:var(--ref);border-left:5px solid var(--refb);padding:8px 12px;margin:8px 0;font-size:.92em}
.ref b{display:block}
.qa{border:1px solid var(--line,#cfd6e0);border-radius:8px;margin:8px 0;background:#fff}
.qa summary{cursor:pointer;padding:10px 12px;font-weight:700}
.qa .ans{padding:0 12px 12px}
.qa .loc{margin:10px 0;padding-top:8px;border-top:1px solid #e3e7ee}
.qa .loc b{display:block}
.qa .hrs{white-space:pre-line;margin-top:4px}
.faq{background:var(--faq);border-left:5px solid var(--faqb);padding:8px 12px;margin:8px 0}
.faq b{display:block}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.btns button{padding:10px 16px;border-radius:8px;border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;font-weight:700}
.btns button.on{background:var(--navy);color:#fff}
.hide{display:none}
.banner{background:#fde7e7;border:2px solid #b3261e;border-radius:10px;padding:14px 18px;margin:14px 0;font-weight:700}
details summary{cursor:pointer;font-weight:700;color:var(--navy)}
.ph{background:#fff1a8;padding:0 3px;border-radius:3px}
.meta{color:var(--muted);font-size:.8em;margin-top:30px}
.office{margin:6px 0 10px}
.office .days{color:var(--muted);font-size:.92em}
@media (max-width:600px){:root{--fs:18px}.bar{position:static}}
</style>

oud","text":"The fastest way to fix this is to go in person to [ONE OF THE OFFICES] and ask for a replacement ballot. You will receive your ballot while you wait, and can fill it out and hand it in right there. Visit iwillvote.com to find your closest election office and its hours. If you cannot get to an election office, you can call [THE OFFICE NAME] at [PHONE]. They will get a ballot out to you for the November 3 election."}]},"und":{"Same for every county|Opening|All":[{"type":"Read aloud","text":"May I speak with [FIRST NAME]? My name is [YOUR NAME] and I'm a volunteer for the PA Dems."}],"Same for every county|Why we're calling|All":[{"type":"Read aloud","text":"We're calling to let you know that [THE OFFICE NAME] has reported a problem with your mail ballot. The ballot they mailed to you was returned to them by the post office because it could not be delivered as addressed. Until the county elections office has a mailing address that works for you, they will not be able to get a ballot to you."}],"Same for every county|How to fix it: Option 1|All counties, through Tuesday, October 27":[{"type":"Read aloud","text":"There are two ways to fix this. The fastest is to go in person to [ONE OF THE OFFICES] and ask for a replacement ballot. You will get your ballot while you wait, and you can fill it out and hand it in right there, so it never has to go through the mail. [OFFICE HOURS SAY]\n\nWill you be able to get to one of them? I can help you find the one closest to you."}],"Same for every county|How to fix it: Option 1|All":[{"type":"Volunteer note","text":"Volunteer: pause here and let them answer. The buttons below only show information for you. They do not record the voter's answer, so you still need to enter it in the survey question in OpenVPB."}],"Same for every county|Show office info|Can get to an office":[{"type":"Reference, not read aloud","text":"[OFFICE LIST]"},{"type":"Read aloud","text":"Great. Can we count on you to stop by [AN ELECTION OFFICE] an plication required|Ask for the commitment|Can't get to an office":[{"type":"Read aloud","text":"The most useful thing you can do is to contact [THE OFFICE NAME] to request a ballot TODAY. Can we count on you to do that?"}],"New mail ballot application required|Voicemail Option 2|All":[{"type":"Read aloud","text":"Please [CONTACT] [THE OFFICE NAME] at [CONTACT INFO], let them know your ballot came back as undeliverable, and that you need a new ballot. Your county requires that a new request be submitted by October 27, so contact them today. [COUNTY NOTE]"}],"Fill out a form (not a mail ballot application)|Option 2|Can't get to an office":[{"type":"Read aloud","text":"No problem. The other option is to fill out [COUNTY] County's [FORM NAME], which you can find at padems.org/resources under County-Specific Forms. [HOW TO SUBMIT THE FORM] Once they have it, they will send a new ballot to your correct address, so use an address where you can get mail right now. If you have questions about the form, call [THE OFFICE NAME] at [PHONE]. [COUNTY NOTE]"}],"Fill out a form (not a mail ballot application)|Ask for the commitment|Can't get to an office":[{"type":"Read aloud","text":"The most useful thing you can do is fill out the [FORM NAME] so the county can send your ballot to the right address. Can we count on you to do that?"}],"Fill out a form (not a mail ballot application)|Voicemail Option 2|All":[{"type":"Read aloud","text":"If you cannot get to an election office, please complete the county's [FORM NAME], which you can find at padems.org/resources under County-Specific Forms. [HOW TO SUBMIT THE FORM]"}],"Call the county|Option 2|Can't get to an office":[{"type":"Read aloud","text":"No problem. The other option is to [CONTACT IMPERATIVE] [THE OFFICE NAME] at [CONTACT INFO] and let them know your mail ballot came back as undeliverable. They will get a replacement ballot out to you. [COUNTY NOTE] Would you be able to [COMMIT ACTION], or would you like me to transfer you to he read-aloud script. The approved Philadelphia and Montgomery scripts have no deadline step. The deadline (close of business on Monday, November 9) moves to the FAQ below."}],"Same for every county|FAQ: When is the deadline?|All":[{"type":"FAQ","text":"The county has to have your ID verified by the close of business on Monday, November 9, the sixth day after the election, but please do not wait: the sooner it is verified, the sooner your ballot counts."}],"Same for every county|Closing|All":[{"type":"Read aloud","text":"Can I answer anything else? If you run into any trouble, the Voter Assistance Hotline can help: 1-833-728-6837. Thank you so much. Your vote matters!"}],"Same for every county|FAQ: Can I just vote at my polling place instead?|All":[{"type":"FAQ","text":"Yes. If you cannot get your ID verified in time, you can vote at your polling place on Election Day, Tuesday, November 3, by provisional ballot. Follow the instructions carefully, because there are two places to sign. The best option is still to verify your ID now."}],"Call the office (generic, Philadelphia pattern)|How to fix it|All":[{"type":"Read aloud","text":"To fix this, call [THE OFFICE NAME] at [PHONE] and tell them you need to verify your ID for your mail ballot to count. If you have a PA driver's license or PennDOT ID, you must use that number. If you have neither, you will need to provide the last four digits of your Social Security number. [COUNTY NOTE]"}],"Call the office (generic, Philadelphia pattern)|Ask for the commitment|All":[{"type":"Read aloud","text":"Can we count on you to make that call?"}],"Call the office (generic, Philadelphia pattern)|Transfer|Office open":[{"type":"Read aloud","text":"For your convenience, I can transfer you to the elections office right now."}],"Call the office (generic, Philadelphia pattern)|Voicemail|All":[{"type":"Read aloud","text":"Hi, this message is for [VOTER NAME]. This is [YOUR NAME] from the PA Dems calling to let you know that [THE OFFICE NAME] was not able to verify the ID you provided on your mail ballot application. So while you may have received your mail ballot, and returned it, your ballot will not be counted unless you call [THE OFFICE NAME] at [PHONE] and tell them you need to verify your ID for your ballot to count. When you call, please have your ID number ready. If you have a PA driver's license or PennDOT ID, you must use that number. If you have neither, you will need to provide the last four digits of your Social Security number. If you have any questions, please call or text our Voter Assistance Hotline at 1-833-728-6837. Thank you."}],"ID Verification Form (Montgomery pattern)|How to fix it|Counties with an ID Verification Form":[{"type":"Read aloud","text":"[COUNTY] allows you to fix this by filling out an ID Verification Form. You can complete it online or on paper and return it to [THE OFFICE NAME]. If you have a PA driver's license or PennDOT ID, you must use that number. If you have neither, you will need to provide the last four digits of your Social Security number. You can find the form on padems.org/resources, under County-Specific Forms. If you have questions about the form, call [THE OFFICE NAME] at [PHONE]."}],"ID Verification Form (Montgomery pattern)|Ask for the commitment|Counties with an ID Verification Form":[{"type":"Read aloud","text":"Can we count on you to complete the ID Verification Form? If you have access to a computer or smartphone, I can walk you through how to find the form right now."},{"type":"Volunteer note","text":"Volunteer: to walk them to the form, have them go to padems.org/resources, scroll to County-Specific Forms, select [COUNTY], then choose ID Verification (Digital to fill it out online, or Paper to print it). If they are not near a computer right now, give them the Voter Assistance Hotline number, 1-833-728-6837, to call or text back when they are. If they need a paper form mailed to them, request it through the Action Center in the Portal."}],"In person (Crawford, Juniata, Lycoming)|How to fix it|Counties that verify ID in person":[{"type":"Read aloud","text":"To fix this, go in person to [THE OFFICE NAME] at [OFFICE ADDRESS] with your ID, and tell them you need to verify your ID for your mail ballot to count. If you have a PA driver's license or PennDOT ID, bring it. If you have neither, you will need to provide the last four digits of your Social Security number. [OFFICE HOURS SAY] [COUNTY NOTE]"}],"In person (Crawford, Juniata, Lycoming)|Ask for the commitment|Counties that verify ID in person":[{"type":"Read aloud","text":"Can we count on you to go to [THE OFFICE NAME] to verify your ID?"}],"By letter (Allegheny)|How to fix it|Allegheny":[{"type":"Read aloud","text":"[COUNTY NOTE]"}]}},"ERR":{"NO SIGNATURE":{"error":"a missing signature on the return envelope","sentence":"the outer return envelope was not signed","willmay":"will","reminder":"This time, the step to watch is the signature: sign the voter's declaration on the outer return envelope."},"NO DATE":{"error":"a missing date on the return envelope","sentence":"the date on the back of your return envelope was missing","willmay":"may","reminder":"This time, the step to watch is the date line on the outer envelope: write the day you sign it, the same way you would date a check. Not your birth date, and not Election Day."},"INCORRECT DATE":{"error":"an incorrect date on the return envelope","sentence":"the date on the back of your return envelope was incorrect","willmay":"may","reminder":"This time, the step to watch is the date line on the outer envelope: write the day you sign it, the same way you would date a check. Not your birth date, and not Election Day."},"NO SECRECY ENVELOPE":{"error":"a missing secrecy envelope","sentence":"your ballot was returned without the yellow secrecy envelope","willmay":"will","reminder":"This time, the step to watch is the yellow secrecy envelope: the ballot goes inside it first, then the sealed yellow envelope go ation","addr":"28 East Market Street, B003, York","phone":"(717) 771-9604","email":"evr@yorkcountypa.gov","offices":[{"name":"Elections Counter","addr":"2401 Pleasant Valley Road, Suite 219, York","sched":{"2026-10-06":["08:00","16:30"],"2026-10-07":["08:00","16:30"],"2026-10-08":["08:00","16:30"],"2026-10-09":["08:00","16:30"],"2026-10-12":["08:00","16:30"],"2026-10-13":["08:00","16:30"],"2026-10-14":["08:00","16:30"],"2026-10-15":["08:00","16:30"],"2026-10-16":["08:00","16:30"],"2026-10-19":["08:00","16:30"],"2026-10-20":["08:00","16:30"],"2026-10-21":["08:00","16:30"],"2026-10-22":["08:00","16:30"],"2026-10-23":["08:00","16:30"],"2026-10-26":["08:00","16:30"],"2026-10-27":["08:00","16:30"]}},{"name":"York County Administrative Center","addr":"28 E Market St, Suite B003, York","sched":{"2026-10-06":["08:00","16:30"],"2026-10-07":["08:00","16:30"],"2026-10-08":["08:00","16:30"],"2026-10-09":["08:00","16:30"],"2026-10-12":["08:00","16:30"],"2026-10-13":["08:00","16:30"],"2026-10-14":["08:00","16:30"],"2026-10-15":["08:00","16:30"],"2026-10-16":["08:00","16:30"],"2026-10-19":["08:00","16:30"],"2026-10-20":["08:00","16:30"],"2026-10-21":["08:00","16:30"],"2026-10-22":["08:00","16:30"],"2026-10-23":["08:00","16:30"],"2026-10-26":["08:00","16:30"],"2026-10-27":["08:00","16:30"]}}],"boxes":0,"lastInPerson":"2026-10-27","term":"election office","env":{"bucket":"Go to BOE office only","variant":"Go to BOE office: more than one office","note":"If you cannot get there because of a disability, a designated agent may be able to do this for you; ask [THE OFFICE NAME].","autoEnd":"","form":"","how":""},"und":{"bucket":"Miscellaneous","contact":"call","note":"You will need to go to the office in person to give the new address in writing and pick up the replacement.","form":"","how":""},"noid":{"variant":"Call the office (generic)","note":""}}},"FAQ":{"all":[{"order":10,"q":"Can I just vote at my polling place instead?","type":"Text","a":"Yes. If you cannot get this fixed by 8 PM on Election Day, Tuesday, November 3, you can vote at your polling place that day by provisional ballot. Follow the instructions carefully, because there are two places to sign. A provisional ballot is counted once the county confirms your mail ballot was not. The best option is still to fix your mail ballot now.","env":true,"und":true,"noid":false,"errs":[],"skip":"No cure"},{"order":10,"q":"Can I just vote at my polling place instead?","type":"Text","a":"Yes. You can vote at your polling place on Election Day, Tuesday, November 3, by provisional ballot. Follow the instructions carefully, because there are two places to sign. The best option is still to get your ID verified with the county now, so your mail ballot counts.","env":false,"und":false,"noid":true,"errs":[],"skip":""},{"order":20,"q":"Where are the drop boxes and when are they open?","type":"Auto: drop boxes","a":"Ballots must be in a box by 8 PM on Election Day.","env":true,"und":true,"noid":true,"errs":[],"skip":""},{"order":40,"q":"Are there drop boxes, or somewhere I can hand in my ballot?","type":"Auto: hand-in sites","a":"The county has no drop boxes, but you can hand your ballot to staff at these places. Your ballot must reach the county by 8 PM on Election Day.","env":true,"und":true,"noid":true,"errs":[],"skip":""},{"order":50,"q":"Where are the election offices and when are they open?","type":"Auto: election offices","a":"Walk in during the posted hours; no appointment. This is not early voting: you apply for, receive and vote a mail ballot in one visit, and the county holds it to be counted on Election Day.","env":true,"und":true,"noid":true,"errs":[],"skip":""},{"order":60,"q":"How do I know there is an issue with my ballot?","type":"Text","a":"You can check your ballot status with the Pennsylvania Department of State's official ballot tracker at https://vote.pa.gov/MailBallotStatus. You can also call your county Board of Elections at [PHONE].","env":true,"und":true,"noid":true,"errs":[],"skip":""},{"order":70,"q":"What was the specific issue with my ballot?","type":"Text","a":"Your ballot was returned to the county because the post office could not deliver it to the address on file. A ballot can come back undeliverable for a few reasons. Sometimes it is something as small as how the address is written or a missing apartment number. Sometimes the address on file is out of date, and sometimes you are simply away from your usual address when the ballot goes out. It also helps to know that mail ballots cannot be forwarded like regular mail.","env":false,"und":true,"noid":false,"errs":[],"skip":""},{"order":70,"q":"What was the specific issue with my ballot?","type":"Text","a":"The ID provided with your ballot application could not be verified by the Board of Elections, and they need you to verify your ID before they can count your ballot. This can happen if your name appears differently on your ID than on your voter registration, or if there is some other information mismatch between agencies.","env":false,"und":false,"noid":true,"errs":[],"skip":""},{"order":70,"q":"What was the specific issue with my ballot?","type":"Text","a":"The date on the back of the envelope was incorrect. It needs to be the day you actually filled it out, the same way you would date a check. Not your birth date, and not Election Day.","env":true,"und":false,"noid":false,"errs":["INCORRECT DATE"],"skip":""},{"order":70,"q":"What was the specific issue with my ballot?","type":"Text","a":"The date on the back of the envelope was missing.","env":true,"und":false,"noid":false,"errs":["NO DATE"],"skip":""},{"order":70,"q":"What was the specific issue with my ballot?","type":"Text","a":"Your ballot was returned without the yellow secrecy envelope.","env":true,"und":false,"noid":false,"errs":["NO SECRECY ENVELOPE"],"skip":""},{"order":70,"q":"What was the specific issue with my ballot?","type":"Text","a":"The outer return envelope was not signed.","env":true,"und":false,"noid":false,"errs":["NO SIGNATURE"],"skip":""},{"order":70,"q":"What was the specific issue with my ballot?","type":"Text","a":"Your ballot was not counted with a reason code of \"other,\" which doesn't allow us to tell you specifically what was wrong. Only your election office will be able to identify why they didn't count your ballot.","env":true,"und":false,"noid":false,"errs":["OTHER"],"skip":""},{"order":80,"q":"Why did I receive a ballot if there was a problem with my application?","type":"Text","a":"Counties are required to mail you a ballot even if they cannot verify the identification information on your application. They cannot count the ballot, though, until your ID is verified. You should have received a separate letter in the mail, apart from your ballot, requesting identification so the county can verify it.","env":false,"und":false,"noid":true,"errs":[],"skip":""},{"order":90,"q":"Who are you? How did you get my number? Is this a scam?","type":"Text","a":"I am a voter protection volunteer with the Democratic Party. We got your number from publicly available data sources. I completely understand the concern. You can check your ballot status yourself with the Pennsylvania Department of State's official ballot tracker at https://vote.pa.gov/MailBallotStatus.","env":true,"und":true,"noid":true,"errs":[],"skip":""},{"order":100,"q":"How did you get this information?","type":"Text","a":"We obtained this information from public data made available by [THE OFFICE NAME] and the Department of State. You can check your ballot status yourself with the Pennsylvania Department of State's official ballot tracker at https://vote.pa.gov/MailBallotStatus.","env":true,"und":true,"noid":true,"errs":[],"skip":""},{"order":120,"q":"What do I do if I run into any problems as I try to fix my ballot?","type":"Text","a":"You can call our Voter Assistance Hotline at 1-833-728-6837.","env":true,"und":true,"noid":true,"errs":[],"skip":""},{"order":130,"q":"Doesn't a ballot with a bad date count anyway?","type":"Text","a":"Right now that's true, but it depends on court cases that are still on appeal, and a ruling could come before your ballot is counted. Your ballot is being set aside until then. Fixing the date means it counts no matter what the courts do.","env":true,"und":false,"noid":false,"errs":["INCORRECT DATE","NO DATE"],"skip":""},{"order":150,"q":"What is the deadline for verifying my ID?","type":"Text","a":"You must complete ID verification with your county Board of Elections by Monday, November 9, but we recommend doing it as soon as possible in case they need additional information.","env":false,"und":false,"noid":true,"errs":[],"skip":""}],"county":{"Adams":[{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Yes, FedEx or UPS is fine. Send it to the elections office at the address on this page, the same one you'd use for regular mail. And if you provide a prepaid FedEx envelope, they're willing to send a ballot out to you that way too.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated Agent)?","a":"Yes. If you have a disability, you can name someone you trust as your designated agent. Your agent fills out the designated agent form and can pick up or return the ballot for you. Here, the office hands the form back to the agent so they can use it again when they deliver the completed ballot, and one person can help several voters as long as there's a separate form for each. No appointment needed; just show the form at the office.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":190,"q":"Will staff come out to my car if I have a disability?","a":"Yes. If you can drive to the office but can't come inside, a staff member will come out to your car.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. If your mail ballot was spoiled, damaged, lost, or returned undeliverable, call the elections office and they can cancel the old one and issue a replacement.","env":true,"und":true,"noid":true,"hideIfBoxes":false}],"Allegheny":[{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Yes. Send it to the Allegheny County Board of Elections, 901 Pennsylvania Avenue, Pittsburgh, PA 15233. One limit: they can't mail a ballot out to you by prepaid FedEx, since a separate vendor handles their outgoing mail.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated Agent)?","a":"Yes. If you have a disability, you can name someone you trust as your designated agent. Your agent fills out the designated agent form and can pick up or return the ballot for you. In Allegheny they take the form the first time, and after that a photocopy is fine for each visit. One agent can help several voters, no appointment needed. If the ballot goes into a drop box, the form gets wrapped around the ballot package; if the site is staffed, just hand it over.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. Call the Allegheny County Board of Elections to cancel your old ballot and have a new one issued, or use the Reissue Request page on the county's elections website.","env":true,"und":true,"noid":true,"hideIfBoxes":false}],"Armstrong":[{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"The office asks that you use their street address, 450 East Market Street, the one printed on the ballot envelope. They haven't handled a prepaid FedEx request before, but they told us they don't see why they wouldn't.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated Agent)?","a":"Yes. If you have a disability, you can name someone you trust as your designated agent. Your agent fills out the designated agent form and can pick up or return the ballot for you. Armstrong keeps the form on file, so an agent helping you again doesn't need a new one; helping a different voter takes a fresh form. If the agent is picking up a replacement, they should bring whatever ballot pieces are being replaced so the office can cancel them. At the drop box, paper-clip the form to the ballot.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":190,"q":"Will staff come out to my car if I have a disability?","a":"Yes, as long as it's you in the car, though it can depend on how busy the office is at that moment.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. Call the elections office to have a replacement sent to you, or go in person to pick one up.","env":true,"und":true,"noid":true,"hideIfBoxes":false}],"Beaver":[{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Yes. Return it to the Election Bureau at the regular address. If you want them to send a ballot out to you using a prepaid label, that works too; just call first so they know it's coming.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated Agent)?","a":"Yes. If you have a disability, you can name someone you trust as your designated agent. Your agent fills out the designated agent form and can pick up or return the ballot for you. In Beaver the agent keeps the form with them and turns it in when the ballot comes back; the office believes it's one voter per visit. There are no drop boxes, so everything comes back to the office. The form can be taped or paper-clipped to the outside of the ballot package, never to the inner envelope.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":190,"q":"Will staff come out to my car if I have a disability?","a":"Yes, they've done it before. Give the office a call when you arrive.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. If your mail ballot was spoiled, damaged, lost, or returned undeliverable, call the elections office and they can cancel the old one and issue a replacement.","env":true,"und":true,"noid":true,"hideIfBoxes":false}],"Bedford":[{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Use the address on the ballot return envelope, which is the office's street address. And yes, they'll send a ballot out via a prepaid FedEx envelope if you provide one.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated Agent)?","a":"Yes. If you have a disability, you can name someone you trust as your designated agent. Your agent fills out the designated agent form and can pick up or return the ballot for you. Bedford scans the form and keeps it on file, so it only needs to be submitted once, and one agent can help several voters with a form for each. At the office, just show the form; at a drop box, paper-clip a copy to the ballot.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":190,"q":"Will staff come out to my car if I have a disability?","a":"This county asks you to use a designated agent instead; staff don't come out to cars.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. Stop by the elections office, or complete a new mail-ballot application online, and they will issue a replacement.","env":true,"und":true,"noid":true,"hideIfBoxes":false}],"Berks":[{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Yes, FedEx or UPS is fine. Send it to the office at 633 Court Street in Reading, the same as the mailing address. If you want a ballot sent out to you by prepaid FedEx, call the office first and they'll talk through your situation.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated Agent)?","a":"Yes. If you have a disability, you can name someone you trust as your designated agent. Your agent fills out the designated agent form and can pick up or return the ballot for you. In Berks, if the form is needed more than once they photocopy it and hand the original back, one agent can help several voters in a visit, and no appointment is needed. When returning the ballot, fold the form in half around it; a rubber band is fine. If you haven't already filed the county's cancel and replace form for a replacement ballot, that gets filled out first, with your signature.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":190,"q":"Will staff come out to my car if I have a disability?","a":"No, staff won't come out to the car in Berks. The fix is to send a designated agent in instead.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. Call the elections office, or complete the county's Cancel and Replace form and email or mail it back to them.","env":true,"und":true,"noid":true,"hideIfBoxes":false}],"Blair":[{"order":30,"q":"Are there drop boxes?","a":"No, there aren't any drop boxes in this county. You'd send the ballot back by mail or bring it to the elections office.","env":true,"und":true,"noid":true,"hideIfBoxes":true},{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"The office asks that you call first to confirm how they want express shipments sent.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. If your mail ballot was spoiled, damaged, lost, or returned undeliverable, call the elections office or stop in and they can cancel the old one and issue a replacement.","env":true,"und":true,"noid":true,"hideIfBoxes":false}],"Bradford":[{"order":30,"q":"Are there drop boxes?","a":"No, there aren't any drop boxes in this county. You'd send the ballot back by mail or bring it to the elections office.","env":true,"und":true,"noid":true,"hideIfBoxes":true},{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Yes. Use the address on the ballot return envelope, which is the office's street address. They'll send a ballot out via prepaid FedEx too, though early in the season a mail house handles their outgoing ballots, so the timing can depend on when you ask.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated Agent)?","a":"Yes. If you have a disability, you can name someone you trust as your designated agent. Your agent fills out the designated agent form and can pick up or return the ballot for you. Bradford reviews the form and keeps a copy on file, and a new form is needed each election cycle. One agent can help several voters with a form for each. There's no drop box, so the ballot comes back to the office with the form paper-clipped to it.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":190,"q":"Will staff come out to my car if I have a disability?","a":"Yes. If you can drive to the office but can't come inside, a staff member will come out to your car.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. Call, email, or visit the elections office. If you request by email or in person, use the county's Replacement Ballot Request form: https://www.bradfordcountypa.gov/DocumentCenter/View/1611/Replacement-Ballot-Request","env":true,"und":true,"noid":true,"hideIfBoxes":false}],"Bucks":[{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Yes, FedEx or UPS is fine, to the Board of Elections at 55 East Court Street in Doylestown. If you want a ballot mailed out to you, they need the signed Cancel and Reissue form first; there's a box on it to check for mailing.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated Agent)?","a":"Yes. If you have a disability, you can name someone you trust as your designated agent. Your agent fills out the designated agent form and can pick up or return the ballot for you. In Bucks the office scans the form into your record the first time, and keeps it for good when the ballot is dropped off. If a replacement ballot is involved, the agent brings the DA form plus the cancel and reissue form. At a drop box, wrap the form around the ballot and clip it; the staff at drop boxes carry paper clips.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":190,"q":"Will staff come out to my car if I have a disability?","a":"No, staff don't come out to cars in Bucks. A designated agent is the way to go.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. Call or visit the Board of Elections or another election office, or email a signed Cancel and Reissue Ballot Request Form: https://www.buckscounty.gov/DocumentCenter/View/25630/2026-General-Election-Cancel-Reissue-Form?bidId=","env":true,"und":true,"noid":true,"hideIfBoxes":false}],"Butler":[{"order":30,"q":"Are there drop boxes?","a":"No, there aren't any drop boxes in this county. You'd send the ballot back by mail or bring it to the elections office.","env":true,"und":true,"noid":true,"hideIfBoxes":true},{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Yes. Send it to the office's street address on this page, not the P.O. Box. FedEx and UPS cannot deliver to a P.O. Box.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Not reliably. Butler has a history of not issuing replacement ballots, though they may make arrangements in special cases, such as if you have a disability. Call the elections office to ask. If a replacement is not available and your ballot cannot be counted as is, you can still vote at your polling place by provisional ballot on Election Day, Tuesday, November 3.","env":true,"und":true,"noid":true,"hideIfBoxes":false}],"Cambria":[{"order":30,"q":"Are there drop boxes?","a":"No, there aren't any drop boxes in this county. You'd send the ballot back by mail or bring it to the elections office.","env":true,"und":true,"noid":true,"hideIfBoxes":true},{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Yes. The street address, 200 South Center Street, works fine. If you have a prepaid envelope for them to use, just bring it to the office.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated Agent)?","a":"Yes. If you have a disability, you can name someone you trust as your designated agent. Your agent fills out the designated agent form and can pick up or return the ballot for you. Cambria only needs one form ever: keep bringing it back and they'll make copies. It's even online, so the agent can fill it out in advance and save a trip. One person can help several voters with a form for each. Walk-in only, and if the agent is dropping off the ballot, they bring it in person.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":190,"q":"Will staff come out to my car if I have a disability?","a":"Sort of. You need to be at the courthouse, and someone from the office will come collect things in the courthouse parking lot.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. If your mail ballot was spoiled, damaged, lost, or returned undeliverable, call the elections office and they can cancel the old one and issue a replacement.","env":true,"und":true,"noid":true,"hideIfBoxes":false}],"Cameron":[{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Use the street address, 20 East 5th Street. Prepaid FedEx isn't something they normally do; they'd rather you come to the office.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated Agent)?","a":"Yes. If you have a disability, you can name someone you trust as your designated agent. Your agent fills out the designated agent form and can pick up or return the ballot for you. Cameron makes a copy at each visit and hands the original back. One agent can help multiple voters; if it's more than two, call ahead. Walk-in only, and the form just gets handed to the clerk with the ballot.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":190,"q":"Will staff come out to my car if I have a disability?","a":"Yes. Park anywhere in the lot and call when you arrive.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. If your mail ballot was spoiled, damaged, lost, or returned undeliverable, call the elections office or stop in and they can cancel the old one and issue a replacement.","env":true,"und":true,"noid":true,"hideIfBoxes":false}],"Carbon":[{"order":30,"q":"Are there drop boxes?","a":"No, there aren't any drop boxes in this county. You'd send the ballot back by mail or bring it to the elections office.","env":true,"und":true,"noid":true,"hideIfBoxes":true},{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Yes, use the mailing address at the top of this page, same as regular mail. They don't send ballots out by prepaid FedEx; no one has ever asked.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated Agent)?","a":"Yes. If you have a disability, you can name someone you trust as your designated agent. Your agent fills out the designated agent form and can pick up or return the ballot for you. Carbon date-stamps the form and gives the original back to the agent. One ent can help several voters. The form and ballot go to the Director's office. Staff will also come out to your vehicle to help if you can't come in.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":190,"q":"Will staff come out to my car if I have a disability?","a":"Yes. If you can drive to the office but can't come inside, a staff member will come out to your car.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. If your mail ballot was spoiled, damaged, lost, or returned undeliverable, you can call, email, or visit the elections office to have the old one cancelled and a replacement issued.","env":true,"und":true,"noid":true,"hideIfBoxes":false}],"Monroe":[{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Yes. Use the office address: Voter Registration, Room 105, One Quaker Plaza, Stroudsburg, PA 18360. They'll also send a ballot out if you provide a prepaid FedEx envelope.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated Agent)?","a":"Yes. If you have a disability, you can name someone you trust as your designated agent. Your agent fills out the designated agent form and can pick up or return the ballot for you. Monroe collects the form along with the ballot. One agent can help several voters with a separate form for each, appointments are optional, and the ballot must come back to the office, not a drop box. Any questions, just call the office.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":190,"q":"Will staff come out to my car if I have a disability?","a":"Yes. If you can drive to the office but can't come inside, a staff member will come out to your car.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. If your mail ballot was spoiled, damaged, lost, or returned undeliverable, call or email the elections office to have the old one cancelled and a replacement issued.","env":true,"und":true,"noid":true,"hideIfBoxes":false}],"Montgomery":[{"order":10,"q":"Can I just vote at my polling place instead?","a":"Yes. If you cannot get this fixed by 8 PM on Election Day, Tuesday, November 3, you can vote at your polling place that day by provisional ballot. Follow the instructions carefully, because there are two places to sign. A provisional ballot is counted once the county confirms your mail ballot was not. The best option is still to get your replacement ballot now.","env":false,"und":true,"noid":false,"hideIfBoxes":false},{"order":110,"q":"My ballot came back damaged in the mail. What happens now?","a":"Good news: the county cancels the damaged ballot and automatically mails you a replacement, with no forms needed if it's going to the same address. And if the replacement never makes it back, a bipartisan team will still count every race that's legible on the damaged ballot. If you'd rather not wait on the mail, you can pick up a replacement at Voter Services or another election office.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":140,"q":"What are Montgomery's cure deadlines?","a":"Mailed replacements go out until the Friday before Election Day, and in-person fixes at Voter Services in Norristown or another election office run through the Monday before. After that, your options are coming in, sending a designated agent if you have a disability, or voting provisionally. ID verification runs later than everything else: the county can take your ID through the sixth day after the election, Monday, November 9.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Yes, send it to the office's physical address. They'll also send a ballot out to you by prepaid FedEx.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated Agent)?","a":"Yes. If you have a disability, you can name someone you trust as your designated agent. Your agent fills out the designated agent form and can pick up or return the ballot for you. In Montgomery your agent keeps the form with them until they're done helping you, and should bring their own ID when picking up a replacement ballot. At a drop box, rubber-band the form to the ballot.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":190,"q":"Will staff come out to my car if I have a disability?","a":"Generally no in Montgomery. If you have a disability, a designated agent is the way to handle it.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. Complete Montgomery's 'Request to Cancel Your Mail-In/Absentee Ballot and Issue a Replacement' form (available online, digital or paper), or call the elections office.","env":true,"und":false,"noid":true,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. Complete Montgomery's 'Request to Cancel Your Mail-In/Absentee Ballot and Issue a Replacement' form (available online, digital or paper), or call the elections office. You can find the form at padems.org/resources in the section for County-Specific Forms: select Montgomery and then Request to Cancel Ballot and Issue Replacement (Digital).","env":false,"und":true,"noid":false,"hideIfBoxes":false}],"Montour":[{"order":30,"q":"Are there drop boxes?","a":"No, there aren't any drop boxes in this county. You'd send the ballot back by mail or bring it to the elections office.","env":true,"und":true,"noid":true,"hideIfBoxes":true},{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Yes, same address as regular mail. Prepaid FedEx has never come up, so they could only say maybe.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated vide the last four digits of your Social Security number. You can find the form at padems.org/resources in the section for County-Specific Forms: select Philadelphia and then Replacement Ballot Request (Digital).","env":false,"und":true,"noid":false,"hideIfBoxes":false},{"order":210,"q":"Can I get a replacement ballot?","a":"Yes. You can get a replacement ballot at the Board of Elections or any other election office. Going in person is fastest; there is also a Replacement Ballot Request Form, which you can find at padems.org/resources in the section for County-Specific Forms - just select Philadelphia and then Replacement Ballot Request (Digital).","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":220,"q":"Can I request a replacement ballot online?","a":"Yes, with the county's Replacement Ballot Request Form. You can find the form at padems.org/resources in the section for County-Specific Forms: select Philadelphia and then Replacement Ballot Request (Digital). The new ballot comes by mail, so use an address where you can get mail right now. Going to an election office is faster.","env":false,"und":true,"noid":false,"hideIfBoxes":false},{"order":230,"q":"Are there other ways to verify my ID besides calling?","a":"Yes. Calling is the easiest, but you can also fill out the county's ID Verification Letter, which can be found at padems.org/resources in the section for County-Specific Forms - just select Philadelphia and then ID Verification Letter. You can also visit one of Philadelphia's election offices in person.","env":false,"und":false,"noid":true,"hideIfBoxes":false}],"Pike":[{"order":160,"q":"Is FedEx or UPS acceptable for ballot return?","a":"Yes, same address as regular mail, and they'll send a ballot out by prepaid FedEx with no special process.","env":true,"und":true,"noid":true,"hideIfBoxes":false},{"order":170,"q":"Can someone else pick up or return my ballot for me (Designated Agent)?","a":"Yes. If you have a disability, you can name someone   primary:"county", inperson:"county", boxcount:"county", extract_fallback:"county", faq_all:"Order", faq_county:"County", locations:"county"};

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(f); f=""; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=ch;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}

function buildData(csv, builtLabel){
  const tab=n=>{const r=parseCSV(csv[n]||""); return r;};
  const body=n=>tab(n).slice(1).map(r=>r.map(v=>(v==null?"":String(v)).trim())).filter(r=>r.some(Boolean));
  const problems=[];
  for(const [n,h] of Object.entries(HUB_HEADERS)){
    const t=tab(n); if(!t.length || (t[0][0]||"").trim()!==h) problems.push(n);
  }
  const templates=n=>{const T={}; for(const r of body(n)){ if(!r[0]) continue; const k=r.slice(0,3).join("|"); (T[k]=T[k]||[]).push({type:r[4]||"",text:r[3]||""}); } return T;};
  const TPL={env:templates("env_scripts"), und:templates("und_scripts"), noid:templates("noid_scripts")};
  const ERR={};

    ERR[r[0]]={error:r[1]||"",sentence:r[2]||"",willmay:r[3]||"",reminder:r[4]||""};
  for(const e of Object.values(ERR)){
    if(e.reminder.toLowerCase().startsWith("same as ")){const k=e.reminder.slice(8).replace(/^[ .]+|[ .]+$/g,"").toUpperCase(); e.reminder=ERR[k]?ERR[k].reminder:"";}
    if(e.reminder==="(none)"||e.reminder==="'(none)") e.reminder="";
  }
  const clean=v=>{v=(v||"").replace(/^'+/,""); return ["(no answer)","(In the approved script.)","(none in either sheet)"].includes(v)?"":v;};
  const ENV={},UND={},NOID={},PRI={},EXT={},BOX={};
  for(const r of body("env_counties")) if(r[1]) ENV[r[1]]={bucket:r[0],variant:r[2]||"",note:clean(r[3])};
  for(const r of body("und_counties")) if(r[1]) UND[r[1]]={bucket:r[0],contact:r[2]||"",note:clean(r[3])};
  for(const r of body("noid_counties")) if(r[0]) NOID[r[0]]={variant:r[1]||"",note:clean(r[2])};
  for(const r of tab("primary").slice(1)){ if(!r[0]||!r[0].trim()) continue; const g=i=>(r[i]==null||r[i]==="None")?"":r[i]; PRI[r[0].trim()]={building:g(1),address:g(2),phone:g(3),email:g(4)}; }
  for(const r of body("extract_fallback")) EXT[r[0]]={phone:r[1]||"",email:r[2]||""};
  for(const r of body("boxcount")) BOX[r[0].replace(/ County$/,"")]=+r[1]||0;
  const pyTitle=s=>s.toLowerCase().replace(/(^|[^A-Za-z])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
  const EV={};
  for(const r of body("inperson")){
    const county=r[0].replace(" County","").trim(), name=r[1]||"", a0=r[2]||"", city=r[3]||"", date=r[4]||"", op=r[5]||"", cl=r[6]||"";
    if(!county||!date) continue;
    const a1=(a0===a0.toUpperCase()&&/[A-Z]/.test(a0))?pyTitle(a0).replace(/'S\b/g,"'s"):a0;
    const key=name+"\u0001"+a1+"\u0001"+city;
    EV[county]=EV[county]||{}; EV[county][key]=EV[county][key]||{name,addr:`${a1}, ${city}`,sched:{}};
    EV[county][key].sched[date]=[op,cl];
  }
  const firstPhone=p=>{p=(p||"").replace(/\n/g," ").replace(/\s+/g," ").trim(); p=p.replace(/^Local:\s*/,""); p=p.split(/;|\bor\b|\(choose/)[0]; p=p.replace(/^[ ,]+|[ ,]+$/g,""); return p.replace(/\s*,?\s*(?:x|ext\.?|extension)\s*:?\s*(\d+)\b/i,", ext. $1");};
  const firstEmail=e=>{const m=(e||"").replace(/\n/g," ").match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/); return m?m[0]:"";};
  const officeName=county=>{
    if(county==="Montgomery") return "Montgomery County Voter Services";

    let b=((PRI[county]||{}).building||"").split("\n")[0].trim();
    b=b.split(/,\s*/)[0].replace(/\s*\(.*?\)/g,"");
    b=b.split(" / ").join(" and ").split("/").join(" and ").split("&").join("and").split("Voter Registrations").join("Voter Registration");
    if(b && !/Office|Board|Bureau|Department|Division|Services|Center/.test(b)) b+=" Office";
    if(b.endsWith("Services")) return b.toLowerCase().includes(county.toLowerCase())?b:`${county} County ${b}`;
    if(!b) return `the ${county} County Board of Elections`;
    if(b.toLowerCase().includes(county.toLowerCase())) return "the "+b;
    return `the ${county} County ${b}`;
  };
  const address=county=>{
    if(county==="Philadelphia") return "City Hall, Room 140, 1400 John F Kennedy Blvd, Philadelphia";
    let a=((PRI[county]||{}).address||"").split(/\n\s*\n/)[0];
    a=a.replace(/\s*\n\s*/g,", ").split("，").join(", ").replace(/^[, ]+|[, ]+$/g,"");

    const lastIP=offices.reduce((m,o)=>{const d=Object.keys(o.sched).sort().pop()||"";return d>m?d:m;},"");
    const p=PRI[county]||{}, x=EXT[county]||{};

      offices,boxes:BOX[county]||0,lastInPerson:lastIP,term:county==="Montgomery"?"voter services office":"election office",
      env:{bucket:env.bucket,variant:env.variant,note,autoEnd,form:eform,how:ehow},
      und:{bucket:und.bucket,contact:und.contact,note:unote,form,how},
      noid:{variant:nid.variant,note:nid.note}};
  }
  // FAQs (from the FAQ tabs in the v3 sheet) and location lists (from the locations sheet)
  const yes=v=>/^y/i.test((v||"").trim());
  const ERRCODE={"no signature":"NO SIGNATURE","no date":"NO DATE","incorrect date":"INCORRECT DATE","no secrecy envelope":"NO SECRECY ENVELOPE","other":"OTHER"};
  const FAQ={all:[],county:{}};
  for(const r of body("faq_all")){ if(!r[1]) continue;
    FAQ.all.push({order:+r[0]||999,q:r[1],type:(r[2]||"Text").trim(),a:r[3]||"",env:yes(r[4]),und:yes(r[5]),noid:yes(r[6]),
      errs:(r[7]||"").split(",").map(x=>ERRCODE[x.trim().toLowerCase()]).filter(Boolean),skip:(r[8]||"").trim()}); }
  for(const r of body("faq_county")){ if(!r[0]||!r[2]) continue;
    (FAQ.county[r[0]]=FAQ.county[r[0]]||[]).push({order:+r[1]||999,q:r[2],a:r[3]||"",env:yes(r[4]),und:yes(r[5]),noid:yes(r[6]),hideIfBoxes:yes(r[7])}); }
  const LOC={};
  for(const r of body("locations")){ if(!r[0]) continue;
    (LOC[r[0]]=LOC[r[0]]||[]).push({name:r[1]||"",addr:r[2]||"",city:r[3]||"",what:r[4]||"",off:r[5]||"",box:r[6]||"",staff:r[7]||""}); }
  if(!FAQ.all.length) problems.push("faq_all empty");
  const ok=problems.length===0 && Object.keys(C).length===67 && Object.keys(TPL.env).length>5 && Object.keys(TPL.und).length>3 && Object.keys(TPL.noid).length>3 && Object.keys(ERR).length===5;
  if(Object.keys(C).length!==67) problems.push(`counties: ${Object.keys(C).length}`);
  return {ok, problems, data:{T:TPL,ERR,C,FAQ,LOC,built:builtLabel}};
}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const APPROVED={Philadelphia:"Philadelphia",Montgomery:"Montgomery"};

// ---------- time (Eastern) ----------
function etNow(){
  const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false,weekday:"short"}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  let date=`${g("year")}-${g("month")}-${g("day")}`, mins=(+g("hour")%24)*60+(+g("minute"));
  const ov=$("#asof").value; if(ov){date=ov; mins=11*60;}
  const dow=new Date(date+"T12:00:00").getDay();
  return {date,mins,dow};
}
const t2m=t=>{const [h,m]=t.split(":").map(Number);return h*60+m;};
function fmtT(t){let [h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return m?`${h}:${String(m).padStart(2,"0")} ${ap}`:`${h} ${ap}`;}
function fmtD(d){return new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});}

// ---------- offices ----------
function mainOffice(c){
  const num=(c.addr.match(/\d+/)||[""])[0];
  return c.offices.find(o=>num&&o.addr.startsWith(num))||c.offices[0];
}
function openNow(c){
  const n=etNow(), o=mainOffice(c);
  if(o && n.date<=c.lastInPerson){const h=o.sched[n.date]; return !!h && n.mins>=t2m(h[0]) && n.mins<t2m(h[1])-15;}
  return n.dow>=1&&n.dow<=5&&n.mins>=9*60&&n.mins<16*60+15;   // after the locations sheet ends: weekday business hours
}
function nextOpen(o,from){const d=Object.keys(o.sched).find(x=>x>=from);return d?[d,o.sched[d]]:null;}
function hoursSay(c){
  const n=etNow();
  if(!c.offices.length || n.date>c.lastInPerson) return "Call ahead to check their hours.";
  if(c.offices.length===1){
    const o=c.offices[0], h=o.sched[n.date];
    if(h) return `It is open today from ${fmtT(h[0])} to ${fmtT(h[1])}.`;
    const nx=nextOpen(o,n.date); return nx?`It is closed today and next opens ${fmtD(nx[0])}, from ${fmtT(nx[1][0])} to ${fmtT(nx[1][1])}.`:"Call ahead to check its hours.";
  }
  const open=c.offices.filter(o=>o.sched[n.date]).length;
  return open?`Today ${open} of them ${open===1?"is":"are"} open, and hours vary by office.`:"None of them are open today, and hours vary by office.";
}
function officeListHTML(c){
  const n=etNow();
  let h=`<div class="ref"><b>${esc(KNAME)} County ${esc(c.term)}s (reference, not read aloud)</b>`;
  if(n.date>c.lastInPerson) h+=`<div>No in-person hours are listed after ${esc(fmtD(c.lastInPerson))}. Call the office before sending a voter.</div>`;
  for(const o of c.offices){
    const days=Object.keys(o.sched).filter(d=>d>=n.date).slice(0,7).map(d=>`${fmtD(d).split(",")[0]} ${d.slice(5).replace("-","/")}: ${fmtT(o.sched[d][0])} to ${fmtT(o.sched[d][1])}`);
    h+=`<div class="office"><b>${esc(o.name)}</b>${esc(o.addr)}<div class="days">${days.length?esc(days.join("; ")):"No upcoming hours listed"}</div></div>`;
  }
  return h+"</div>";
}

// ---------- placeholders ----------
let KNAME="", CTX={}, ONEOFFICE=false;
function contactParts(c,mode){
  let m=(c.und.contact||"call").toLowerCase();
  if(m.includes("email")&&!c.email) m="call";
  if(m.startsWith("call or")) return {c:"call or email",v:"calling or emailing",imp:"call or email",info:`${c.phone} or ${c.email}`,act:"reach out",call:true};
  if(m==="email") return {c:"email",v:"emailing",imp:"email",info:c.email,act:"send that email",call:false};
  return {c:"call",v:"calling",imp:"call",info:c.phone,act:"make that call",call:true};
}
function fill(s){
  let out=s;
  for(let i=0;i<3;i++) out=out.replace(/\[([A-Z /,0-9-]+)\]/g,(m,k)=>{
    if(k in CTX) return CTX[k];
    if(["FIRST NAME","YOUR NAME","VOTER NAME"].includes(k)) return `\u0001${k}\u0002`;
    return m;
  });
  out=out.replace(/(^|[.!?]\s+|\n)the /g,(m,a)=>a+"The ");
  out=out.replace(/\s+\./g,".").replace(/ {2,}/g," ").replace(/\b([aA]) ([AEIOU])/g,"$1n $2").trim();
  if(ONEOFFICE) out=out.replace("Will you be able to get to one of them? I can help you find the one closest to you.","Will you be able to get there? I can help you with the address and hours.");
  return esc(out).replace(/\u0001([^\u0002]+)\u0002/g,'<span class="ph">[$1]</span>');
}
function setCtx(c,code){
  const term=c.term, an=(term[0]==="e"?"an ":"a ")+term;
  const cp=contactParts(c);
  const E=code?D.ERR[code]:null;
  CTX={
    "COUNTY":KNAME,"THE OFFICE NAME":c.office,"OFFICE ADDRESS":c.addr,"PHONE":c.phone,"EMAIL":c.email||c.phone,
    "OFFICE HOURS SAY":hoursSay(c),"OFFICE OPEN DAYS":"weekdays during business hours",
    "ONE OF THE OFFICES":c.offices.length>1?`one of ${KNAME} County's ${term}s`:c.office,
    "AN ELECTION OFFICE":an,"ELECTION OFFICE":term,
    "CONTACT":cp.c,"CONTACT VERB":cp.v,"CONTACT IMPERATIVE":cp.imp,"CONTACT INFO":cp.info,"COMMIT ACTION":cp.act,
    "AUTO REPLACE END DATE":c.env.autoEnd||"(date not in the sheet)",
    "DROP BOX LINE":c.boxes>0?`Your county has ballot drop boxes, and using a drop box or hand delivering your ballot to ${an} is the most reliable way to get your ballot in on time. If you want to know your closest ${term} or drop box where you can return your ballot, let me know and I can help you find it.`:`Hand delivering your ballot to ${c.office} is the most reliable way to get your ballot in on time.`,
  };
  if(E){CTX["ERROR"]=E.error;CTX["ERROR SENTENCE"]=E.sentence;CTX["WILL/MAY"]=E.willmay;CTX["ERROR REMINDER"]=E.reminder;}
}

// ---------- rendering ----------
const T=k=>D.T[KIND][k]||[];
let HTML="";
function item(e,{skipNotes=false}={}){
  const t=e.text; if(!t) return "";
  if(t.startsWith("[How to fill")||t==="[OFFICE LIST]"||t.startsWith("Removed from the read-aloud")||t.startsWith("Not offered.")) return "";
  if(e.type==="Volunteer note") return skipNotes?"":`<div class="vnote">${fill(t)}</div>`;
  if(e.type==="FAQ") return `<div class="say">${fill(t)}</div>`;
  if(e.type.startsWith("Reference")) return `<div class="ref">${fill(t)}</div>`;
  return `<div class="say">${fill(t)}</div>`;
}
const items=(k,o)=>T(k).map(e=>item(e,o)).join("");
function card(title,inner,cls=""){return inner?`<div class="card ${cls}"><h2>${esc(title)}</h2>${inner}</div>`:"";}
function faq(q,k){const a=T(k).map(e=>fill(e.text)).join(" ");return a?`<div class="faq"><b>${esc(q)}</b>${a}</div>`:"";}
function transferHTML(c,lead){
  if(openNow(c)) return (lead?`<div class="say">${fill(lead)}</div>`:"")+`<div class="vnote">Volunteer: if they want the transfer, wait for them to say yes before you start it.</div>`+ENVT("Same for every county|Transfer (when offered)|Office open").map(e=>item(e)).join("")+`<div class="btns"><button onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(c.phone)}')">Copy ${esc(KNAME)} office number</button></div><div class="vnote">The phone number will be copied to your clipboard. Then use the transfer tool in Dialpad to connect the voter.</div>`;

}

function vmCard(parts){

function branchButtons(id,a,b){return `<div class="btns" data-grp="${id}"><button data-show="${id}A">${esc(a)}</button><button data-show="${id}B">${esc(b)}</button></div>`;}
function wire(){

    btn.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===btn));
    ["A","B"].forEach(s=>{const el=document.getElementById(g+s);if(el)el.classList.toggle("hide",btn.dataset.show!==g+s);});

}
function closing(){return card("Closing",items("Same for every county|Closing|All"));}

// ---------- FAQ from the FAQ tabs (v3 sheet) + location lists ----------
function locList(list,field){
  return list.map(l=>`<div class="loc"><b>${esc(l.name)}</b>${esc(l.addr)}${l.city?", "+esc(l.city):""}<div class="hrs">${esc(l[field]||"Call the county for hours.")}</div></div>`).join("");
}
function faqHTML(c,code,already){
  if(!D.FAQ) return "";
  const col=KIND, locs=(D.LOC&&D.LOC[KNAME])||[];
  const boxes=locs.filter(l=>/Drop box/.test(l.what)), offices=locs.filter(l=>/Election office/.test(l.what)), staff=locs.filter(l=>/Hand ballot to staff/.test(l.what));
  const countyRows=((D.FAQ.county[KNAME])||[]).filter(r=>r[col] && !(r.hideIfBoxes && boxes.length));
  const countyQ=new Set(countyRows.map(r=>r.q.toLowerCase()));
  const items=[];
  for(const r of D.FAQ.all){
    if(!r[col] || countyQ.has(r.q.toLowerCase())) continue;
    if(KIND==="env" && r.errs.length && !r.errs.includes(code)) continue;
    if(KIND==="env" && r.skip && c.env.bucket.toLowerCase()===r.skip.toLowerCase()) continue;
    let body="";
    if(/^auto: drop boxes/i.test(r.type)){ if(!boxes.length) continue; body=`<p>${fill(r.a)}</p>`+locList(boxes,"box"); }
    else if(/^auto: hand-in/i.test(r.type)){ if(boxes.length||!staff.length) continue; body=`<p>${fill(r.a)}</p>`+locList(staff,"staff"); }
    else if(/^auto: election offices/i.test(r.type)){ if(!offices.length) continue; body=`<p>${fill(r.a)}</p>`+locList(offices,"off"); }
    else body=`<p>${fill(r.a).replace(/\n/g,"<br>")}</p>`;
    items.push({order:r.order,q:r.q,body});
  }
  for(const r of countyRows) items.push({order:r.order,q:r.q,body:`<p>${fill(r.a).replace(/\n/g,"<br>")}</p>`});
  const out=items.filter(it=>!already.includes(`<b>${esc(it.q)}</b>`)).sort((a,b)=>a.order-b.order)
    .map(it=>`<details class="qa"><summary>${esc(it.q)}</summary><div class="ans">${it.body}</div></details>`).join("");
  return card("Voter questions (not read aloud unless the voter asks)",out);
}

// ---------- setup ----------
async function loadLive(){
  if(!/^https:\/\//.test(HUB)) throw new Error("no published sheet");
  const csv={};
  await Promise.all(Object.entries(HUB_TABS).map(async([name,gid])=>{
    const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),12000);
    try{
      const r=await fetch(`${HUB}?gid=${gid}&single=true&output=csv&cb=${Date.now()}`,{signal:ctl.signal,cache:"no-store"});
      if(!r.ok) throw new Error(name+" "+r.status);
      const txt=await r.text(); if(/^\s*</.test(txt)) throw new Error(name+" not csv");
      csv[name]=txt;
    } finally{clearTimeout(t);}
  }));
  const b=buildData(csv,"live");
  if(!b.ok) throw new Error("check failed: "+b.problems.join(", "));
  return b.data;
}
function start(){
if(/[?&]preview\b/.test(location.search)) $("#previewCtl").hidden=false;
// ---------- setup ----------
const sel=$("#county");
Object.keys(D.C).sort().forEach(k=>{const o=document.createElement("option");o.value=o.textContent=k;sel.appendChild(o);});
sel.onchange=render; $("#asof").onchange=render;
if(KIND==="env"){
  const labs={"NO SIGNATURE":"No signature","NO DATE":"No date","INCORRECT DATE":"Incorrect date","NO SECRECY ENVELOPE":"No secrecy envelope","OTHER":"Other"};
  $("#errs").innerHTML="<b>Ballot error:</b> "+Object.entries(labs).map(([k,v],i)=>`<label><input type="radio" name="err" value="${k}" ${i?"":"checked"}> ${v}</label>`).join("");
  document.querySelectorAll("input[name=err]").forEach(r=>r.onchange=render);
} else $("#errs").remove();
let fs=20; try{fs=+localStorage.getItem("sheetScriptFs")||20;}catch(e){}
const setFs=v=>{fs=Math.max(14,Math.min(32,v));document.documentElement.style.setProperty("--fs",fs+"px");try{localStorage.setItem("sheetScriptFs",fs);}catch(e){}};
setFs(fs); $("#smaller").onclick=()=>setFs(fs-2); $("#bigger").onclick=()=>setFs(fs+2);
render();
}
$("#out").innerHTML='<div class="card">Loading the latest county details...</div>';
loadLive().then(d=>{D=d; const m=$("#mark"); m.className="live"; m.title="Live data, loaded "+new Date().toLocaleTimeString();}).catch(e=>{
  console.warn("Live data not loaded:",e&&e.message);
  const s=$("#stale"); s.hidden=false;
  s.textContent="Could not load the latest county details, so this page is showing a saved copy from "+SNAP_LABEL+". Check the phone number and hours with the county before you give them to a voter.";
}).finally(start);
</script>
</body>
</html>
